<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cosmic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Orbit Glow -->
  <ellipse cx="50" cy="50" rx="38" ry="18" stroke="url(#cosmic-grad)" stroke-width="2.5" stroke-dasharray="4 2" transform="rotate(-30 50 50)" opacity="0.6" />
  <ellipse cx="50" cy="50" rx="38" ry="18" stroke="url(#cosmic-grad)" stroke-width="2" transform="rotate(35 50 50)" opacity="0.75" />
  
  <!-- Central Star Nexus -->
  <circle cx="50" cy="50" r="10" fill="url(#cosmic-grad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
  
  <!-- Orbiting Satellites / Stardust -->
  <circle cx="20" cy="38" r="2.5" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="80" cy="62" r="3" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="68" cy="28" r="2" fill="#ffffff" />
</svg>
